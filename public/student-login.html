<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login | Kumasi STEM JHS</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-mark">K</div>
          <div>
            <h2>Kumasi STEM JHS</h2>
            <small>Student Election Portal</small>
          </div>
        </div>

        <div class="status-badge" id="loginStatusBadge">🟢 Election Live</div>

        <h1>Student Login</h1>
        <p class="muted">Sign in with your Student ID to access the election.</p>

        <form id="studentLoginForm" class="stack-form">
          <label>
            Student ID
            <input type="text" id="studentId" name="studentId" placeholder="e.g. STU-1001" required />
          </label>

          <label id="pinFieldWrapper" class="hidden">
            PIN / Password
            <input type="password" id="pin" name="pin" placeholder="Enter PIN if required" />
          </label>

          <button type="submit" class="primary-btn full-width">Continue to Voting</button>
        </form>

        <p id="loginMessage" class="form-message" aria-live="polite"></p>
        <a class="text-link" href="/">Back to Home</a>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
